name: Release Smoke Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to test
        required: true
        default: "0.1.13"

jobs:
  macos:
    name: macOS remote TUI binary
    runs-on: macos-latest
    steps:
      - name: Download release asset
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          asset="solder-${VERSION}-macos-arm64.zip"
          curl -fL -o "$asset" "https://github.com/solderable/solder/releases/download/${VERSION}/${asset}"
          unzip -q "$asset" -d release

      - name: Run solder binary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bin="release/solder-${VERSION}-macos-arm64/solder"
          test -x "$bin"
          version_output="$("$bin" --version)"
          printf '%s\n' "$version_output"
          test "$version_output" = "solder v${VERSION}"

          help_output="$("$bin" --help)"
          printf '%s\n' "$help_output"
          grep -F "Usage: solder [options]" <<<"$help_output"

      - name: Check bundled SolderCAD
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          root="release/solder-${VERSION}-macos-arm64"
          app="$root/SolderCAD.app"
          shared="$app/Contents/SharedSupport"
          kicad_cli="$app/Contents/MacOS/kicad-cli"

          test -x "$app/Contents/MacOS/kicad"
          test -x "$kicad_cli"
          test -f "$shared/resources/images.tar.gz"
          test -f "$shared/schemas/pcm.v1.schema.json"
          test -f "$shared/schemas/pcm.v2.schema.json"
          test -d "$shared/3dmodels"

          find "$shared/symbols" -type f -name '*.kicad_sym' -print -quit | grep -q .
          find "$shared/footprints" -maxdepth 1 -type d -name '*.pretty' -print -quit | grep -q .
          find "$shared/template" -type f -name '*.kicad_pro' -print -quit | grep -q .
          find "$shared/3dmodels" -type f \( -name '*.step' -o -name '*.stp' -o -name '*.wrl' \) -print -quit | grep -q .

          "$kicad_cli" version

  windows:
    name: Windows remote TUI binary
    runs-on: windows-latest
    steps:
      - name: Download release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $asset = "solder-$version-windows-x64.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/solderable/solder/releases/download/$version/$asset" `
            -OutFile $asset
          Expand-Archive -LiteralPath $asset -DestinationPath release -Force

      - name: Check Windows installer dry run
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/solderable/solder/main/install.ps1" `
            -OutFile install.ps1

          $dryRunOutput = (& .\install.ps1 -DryRun -Version $version *>&1 | Out-String).Trim()
          Write-Host $dryRunOutput
          if (-not $dryRunOutput.Contains("KICAD_DISABLE_LIBRARY_PRELOAD: 1")) {
            throw "install.ps1 dry run did not include KICAD_DISABLE_LIBRARY_PRELOAD"
          }
          if (-not $dryRunOutput.Contains("KICAD_SOFTWARE_RENDERING: cleared")) {
            throw "install.ps1 dry run did not clear KICAD_SOFTWARE_RENDERING"
          }

      - name: Run solder binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $bin = Join-Path "release" "solder-$version-windows-x64\solder.exe"
          if (-not (Test-Path -LiteralPath $bin -PathType Leaf)) {
            throw "Missing solder.exe at $bin"
          }
          $versionOutput = (& $bin --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "solder.exe --version exited with $LASTEXITCODE"
          }
          Write-Host $versionOutput
          if ($versionOutput -ne "solder v$version") {
            throw "unexpected solder.exe --version output: '$versionOutput'"
          }

          $helpOutput = (& $bin --help 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "solder.exe --help exited with $LASTEXITCODE"
          }
          Write-Host $helpOutput
          if (-not $helpOutput.Contains("Usage: solder [options]")) {
            throw "solder.exe --help output did not include usage text"
          }

      - name: Check bundled SolderCAD
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ inputs.version }}"
          $root = Join-Path "release" "solder-$version-windows-x64"
          $solderCad = Join-Path $root "SolderCAD"
          $binDir = Join-Path $root "SolderCAD\bin"
          $shareDir = Join-Path $solderCad "share\kicad"
          $kicad = Join-Path $binDir "kicad.exe"
          $kicadCli = Join-Path $binDir "kicad-cli.exe"
          $python = Join-Path $binDir "python.exe"
          $encodingInit = Join-Path $binDir "Lib\encodings\__init__.py"
          $symbols = Join-Path $shareDir "symbols"
          $footprints = Join-Path $shareDir "footprints"
          $template = Join-Path $shareDir "template"
          $schemas = Join-Path $shareDir "schemas"
          $models = Join-Path $shareDir "3dmodels"
          $resources = Join-Path $shareDir "resources"

          function Assert-Path {
            param(
              [string] $Path,
              [string] $PathType,
              [string] $Description
            )

            if (-not (Test-Path -LiteralPath $Path -PathType $PathType)) {
              throw "Missing $Description at $Path"
            }
          }

          function Assert-AnyFile {
            param(
              [string] $Directory,
              [string] $Filter,
              [string] $Description
            )

            Assert-Path -Path $Directory -PathType Container -Description $Description
            $match = Get-ChildItem -LiteralPath $Directory -Recurse -File -Filter $Filter -ErrorAction Stop | Select-Object -First 1
            if (-not $match) {
              throw "Missing $Description in $Directory"
            }
            Write-Host "$Description sample: $($match.FullName)"
          }

          function Assert-AnyDirectory {
            param(
              [string] $Directory,
              [string] $Filter,
              [string] $Description
            )

            Assert-Path -Path $Directory -PathType Container -Description $Description
            $match = Get-ChildItem -LiteralPath $Directory -Directory -Filter $Filter -ErrorAction Stop | Select-Object -First 1
            if (-not $match) {
              throw "Missing $Description in $Directory"
            }
            Write-Host "$Description sample: $($match.FullName)"
          }

          Assert-Path -Path $kicad -PathType Leaf -Description "kicad.exe"
          Assert-Path -Path $kicadCli -PathType Leaf -Description "kicad-cli.exe"
          Assert-Path -Path $python -PathType Leaf -Description "bundled python.exe"
          Assert-Path -Path $encodingInit -PathType Leaf -Description "bundled Python encodings"
          Assert-Path -Path (Join-Path $schemas "pcm.v1.schema.json") -PathType Leaf -Description "KiCad PCM v1 schema"
          Assert-Path -Path (Join-Path $schemas "pcm.v2.schema.json") -PathType Leaf -Description "KiCad PCM v2 schema"
          Assert-Path -Path (Join-Path $resources "images.tar.gz") -PathType Leaf -Description "KiCad resource image archive"
          Assert-Path -Path $models -PathType Container -Description "KiCad 3D model directory"
          Assert-AnyFile -Directory $symbols -Filter "*.kicad_sym" -Description "KiCad symbol library"
          Assert-AnyDirectory -Directory $footprints -Filter "*.pretty" -Description "KiCad footprint library"
          Assert-AnyFile -Directory $template -Filter "*.kicad_pro" -Description "KiCad template library"

          $kicadVersion = (& $kicadCli version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "kicad-cli.exe version exited with $LASTEXITCODE"
          }
          Write-Host $kicadVersion

          $pythonEncoding = (& $python -c "import sys, encodings; print(sys.prefix); print(encodings.__file__)" 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "bundled python.exe failed to import encodings:`n$pythonEncoding"
          }
          Write-Host $pythonEncoding

          $dumpbinCommand = Get-Command dumpbin -ErrorAction SilentlyContinue
          $dumpbinPath = if ($dumpbinCommand) { $dumpbinCommand.Source } else { $null }
          if (-not $dumpbinPath) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $vsInstall = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            $dumpbinPath = Get-ChildItem -LiteralPath (Join-Path $vsInstall "VC\Tools\MSVC") -Directory |
              Sort-Object Name -Descending |
              Select-Object -First 1 |
              ForEach-Object { Join-Path $_.FullName "bin\Hostx64\x64\dumpbin.exe" }
          }

          $debugNamePatterns = @(
            '.*-gd-.*\.dll$',
            '.*_d\.dll$',
            '^python\d+_d\.dll$',
            '^python3_d\.dll$',
            'wx.*ud_.*\.dll$'
          )
          $debugImportPatterns = @(
            'MSVCRTD\.dll',
            'MSVCP140D\.dll',
            'VCRUNTIME140D\.dll',
            'VCRUNTIME140_1D\.dll',
            'UCRTBASED\.dll'
          )
          $violations = New-Object System.Collections.Generic.List[string]

          Get-ChildItem -LiteralPath $binDir -File -Filter *.dll | ForEach-Object {
            foreach ($pattern in $debugNamePatterns) {
              if ($_.Name -match $pattern) {
                $violations.Add("debug DLL in SolderCAD bin: $($_.Name)")
                break
              }
            }
          }

          Get-ChildItem -LiteralPath $binDir -File | Where-Object { $_.Extension -in @(".dll", ".exe") } | ForEach-Object {
            $binary = $_
            $dependents = & $dumpbinPath /nologo /dependents $binary.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed while checking $($binary.FullName)"
            }

            foreach ($line in $dependents) {
              $dependent = ([string] $line).Trim()
              foreach ($pattern in $debugImportPatterns) {
                if ($dependent -match "^$pattern$") {
                  $violations.Add("$($binary.Name) imports debug runtime $dependent")
                }
              }
            }
          }

          if ($violations.Count -gt 0) {
            throw "SolderCAD contains debug-runtime artifacts:`n$($violations -join "`n")"
          }
